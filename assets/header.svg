<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Método de trabajo con agentes de IA</title>
  <desc id="desc">Una necesidad pasa por intención, contexto, ejecución y evidencia, bajo control humano.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#102b3f"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#4dd4c6"/><stop offset="1" stop-color="#82aaff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="68" r="160" fill="#4dd4c6" opacity=".05"/><circle cx="75" cy="390" r="180" fill="#82aaff" opacity=".05"/>
  <text x="64" y="78" fill="#93a8bd" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" letter-spacing="3">PRODUCTO · IA APLICADA · EVIDENCIA</text>
  <text x="64" y="132" fill="#f3f8fc" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="700">Método de trabajo con agentes de IA</text>
  <text x="64" y="171" fill="#b8c7d6" font-family="Inter,Segoe UI,sans-serif" font-size="20">De la necesidad de negocio a una entrega revisable y gobernada.</text>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(64 230)"><rect width="218" height="112" rx="18" fill="#132f43" stroke="#28506a"/><circle cx="32" cy="31" r="13" fill="#4dd4c6"/><text x="57" y="38" fill="#f3f8fc" font-size="19" font-weight="700">Intención</text><text x="24" y="75" fill="#aebfce" font-size="15">Objetivo y criterio</text><text x="24" y="97" fill="#aebfce" font-size="15">de éxito</text></g>
    <path d="M292 286h38" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/><path d="m323 278 10 8-10 8" fill="none" stroke="#82aaff" stroke-width="4"/>
    <g transform="translate(342 230)"><rect width="218" height="112" rx="18" fill="#132f43" stroke="#28506a"/><circle cx="32" cy="31" r="13" fill="#63c6df"/><text x="57" y="38" fill="#f3f8fc" font-size="19" font-weight="700">Contexto</text><text x="24" y="75" fill="#aebfce" font-size="15">Fuentes, alcance</text><text x="24" y="97" fill="#aebfce" font-size="15">y restricciones</text></g>
    <path d="M570 286h38" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/><path d="m601 278 10 8-10 8" fill="none" stroke="#82aaff" stroke-width="4"/>
    <g transform="translate(620 230)"><rect width="218" height="112" rx="18" fill="#132f43" stroke="#28506a"/><circle cx="32" cy="31" r="13" fill="#71b8f0"/><text x="57" y="38" fill="#f3f8fc" font-size="19" font-weight="700">Ejecución</text><text x="24" y="75" fill="#aebfce" font-size="15">Responsabilidad</text><text x="24" y="97" fill="#aebfce" font-size="15">y cambio acotado</text></g>
    <path d="M848 286h38" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/><path d="m879 278 10 8-10 8" fill="none" stroke="#82aaff" stroke-width="4"/>
    <g transform="translate(898 230)"><rect width="238" height="112" rx="18" fill="#17354a" stroke="#4dd4c6"/><circle cx="32" cy="31" r="13" fill="#82aaff"/><text x="57" y="38" fill="#f3f8fc" font-size="19" font-weight="700">Evidencia</text><text x="24" y="75" fill="#aebfce" font-size="15">Revisión, aprobación</text><text x="24" y="97" fill="#aebfce" font-size="15">y continuidad</text></g>
  </g>
  <rect x="954" y="64" width="182" height="52" rx="26" fill="none" stroke="#4dd4c6" stroke-width="2"/>
  <text x="1045" y="97" text-anchor="middle" fill="#dffbf7" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">CONTROL HUMANO</text>
</svg>
